name: Android build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test, lint, and build debug APK
        run: bash gradlew testDebugUnitTest lintDebug assembleDebug --no-daemon
      - name: Check unsigned release build for pull requests
        if: github.event_name == 'pull_request'
        run: bash gradlew assembleRelease --no-daemon
      - name: Build and verify signed APK
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          MUSE_KEYSTORE_BASE64: ${{ secrets.MUSE_KEYSTORE_BASE64 }}
          MUSE_KEYSTORE_FILE: ${{ runner.temp }}/muse-release.jks
          MUSE_KEYSTORE_PASSWORD: ${{ secrets.MUSE_KEYSTORE_PASSWORD }}
          MUSE_KEY_ALIAS: ${{ secrets.MUSE_KEY_ALIAS }}
          MUSE_KEY_PASSWORD: ${{ secrets.MUSE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          : "${MUSE_KEYSTORE_BASE64:?Configure the release signing secrets first}"
          : "${MUSE_KEYSTORE_PASSWORD:?Missing keystore password}"
          : "${MUSE_KEY_ALIAS:?Missing key alias}"
          : "${MUSE_KEY_PASSWORD:?Missing key password}"
          trap 'rm -f "$MUSE_KEYSTORE_FILE"' EXIT
          printf '%s' "$MUSE_KEYSTORE_BASE64" | base64 --decode > "$MUSE_KEYSTORE_FILE"
          bash gradlew assembleRelease --no-daemon
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          version="$(jq -r '.elements[0].versionName' app/build/outputs/apk/release/output-metadata.json)"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo 'Tag must match the APK version' >&2
            exit 1
          fi
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/MuseLauncher-v$version.apk"
          cd dist
          sha256sum *.apk > SHA256SUMS.txt
      - name: Upload installable release APK
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: dist/
          if-no-files-found: error
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/muse-release.jks"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports
          path: app/build/reports/

  publish:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-apk
          path: dist/
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/*.apk dist/SHA256SUMS.txt \
            --verify-tag --title "Muse Launcher $RELEASE_TAG" \
            --notes-file docs/RELEASE_NOTES.md
